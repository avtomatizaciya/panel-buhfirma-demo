      i5 += row(short(n), s / M.cl[0][1] * 100, pc(s, M.totalAll) + '%', `<p class="note">Выставлено ${l.length} счетов на ${m0(s)}; не найдена оплата: ${m0(sum(u, r => r.sum))}. Накопительно ${pc(cum, M.totalAll)}%.</p>` + (u.length ? invTable(u) : '')); }
  }
  let i6 = '<p class="cap">Сколько дней проходит от выставления счёта до оплаты. В срез входят только счета, оплата которых найдена в выписках 1С (а не все выставленные). Для каждого срока: сколько счетов и на какую сумму. Нажмите срок: самые крупные счета.</p>';

    M.hist.forEach((h, k) => { i6 += row(BK[k][0], h.n / mxh * 100, `${h.n} сч. · ${ms(h.sum)} ₽`, h.n ? '<table><tr><th>Клиент</th><th>Счёт</th><th>Оплата</th><th class="r">Сумма</th></tr>' + h.items.slice(0, 12).map(r => `<tr><td>${esc(short(r.name))}</td><td>${dmy(r.date)}</td><td>${dmy(r.paid)}</td><td class="r">${m0(r.sum)}</td></tr>`).join('') + '</table>' : ''); });
  } else i6 += '<p class="note">За период оплат по выпискам нет.</p>';
  let i7 = '<p class="cap">Дата последней банковской операции в 1С по каждой организации. Норма: не старше 20 дней. Организации в архиве не показаны.</p>';
  i7 += M.banks.length ? '<table><tr><th>Организация</th><th>Последняя операция</th><th class="r">Дней</th></tr>' + M.banks.slice().sort((a, b) => (a.age === null) - (b.age === null) || (a.age || 0) - (b.age || 0)).map(b => `<tr class="${b.age !== null && b.age <= 20 ? '' : 'dim'}"><td>${esc(b.name)}</td><td>${b.last ? dmy(b.last) : 'нет'}</td><td class="r">${b.age !== null ? b.age : '-'}</td></tr>`).join('') + '</table><p class="mut">Организации без операций больше 90 дней могут не вестись; по данным 1С не отличить от незагруженных выписок.</p>' : '<p class="note">Выбранного клиента нет среди организаций в базе (банк не ведётся здесь).</p>';
  i7 += NOTE_EXC(D);
  const INN = [['Сколько выставили', i1], ['Что проверить', i2], ['Кто не платит', i3], ['Когда платят', i4], [cl1 ? 'Доля в выручке' : 'Кто даёт выручку', i5], ['Как быстро платят', i6], ['Банк в 1С', i7]];
  let body = T.join('');
  INN.forEach(([t, c], k) => { body = body.replace(`%%${k + 1}%%`, `<div class="inner">${back()}<h2>${t}</h2>${c}</div>`); });
  // строка-вывод
  let v;
  if (!M.total) v = 'За выбранный период счетов нет';

  return { body, verdict: v, M };
}
function periodLabel(D, per) {
